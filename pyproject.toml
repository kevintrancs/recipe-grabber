[project]
name = "recipe-grabber"
version = "2.0.0"
description = "Turn recipe pages into clean, shareable ingredient lists."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "curl-cffi>=0.13",
    "flask>=3.1,<4",
    "ingredient-parser-nlp>=2.7,<3",
    "recipe-scrapers>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["server"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["server/recipe_grabber"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
